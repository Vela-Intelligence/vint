name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: tag must match package.json version
        run: |
          v="v$(node -p "require('./package.json').version")"
          test "$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != package.json $v"; exit 1; }
      - run: npx biome ci .
      - run: npm run typecheck
      - run: npm run check:props
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - run: npm run check:alignment
      - run: gh release create "$GITHUB_REF_NAME" dist/vint.js dist/vint.prod.js dist/vint.d.ts --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
